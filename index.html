<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>50/30/20 Inflation & Budget Matrix</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151f32;
            --primary: #eab308;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #22334f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 550px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(234, 179, 8, 0.05);
            margin-bottom: 80px;
        }

        h1 {
            font-size: 22px;
            color: var(--primary);
            text-align: center;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        p.subtitle {
            font-size: 14px;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 24px;
        }

        .ad-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 15px 0;
            min-height: 60px;
            background: rgba(255, 255, 255, 0.01);
            border-radius: 8px;
            border: 1px dashed var(--border-color);
            overflow: hidden;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .currency-symbol {
            position: absolute;
            left: 14px;
            color: var(--primary);
            font-weight: bold;
        }

        input[type="number"] {
            width: 100%;
            background: #080c14;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 12px 12px 30px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: border 0.2s;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--primary);
            margin-top: 8px;
        }

        input[type="number"]:focus {
            border-color: var(--primary);
        }

        .results-box {
            background: #080c14;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-top: 24px;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .result-row:last-child {
            border-bottom: none;
        }

        .result-label {
            font-size: 14px;
            color: var(--text-main);
        }

        .result-value {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
        }

        .result-value.danger {
            color: #ef4444;
        }

        #sticky-bottom-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #080c14;
            border-top: 1px solid var(--border-color);
            padding: 10px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Inflation Budget Matrix</h1>
        <p class="subtitle">Calculate your real 50/30/20 spending limit targets under rising costs</p>

        <div id="monetag-banner-top" class="ad-container"></div>

        <div class="input-group">
            <label for="monthly-income">Net Monthly Income (After Tax)</label>
            <div class="input-wrapper">
                <span class="currency-symbol">$</span>
                <input type="number" id="monthly-income" value="3500" oninput="calculateBudget()">
            </div>
        </div>

        <div class="input-group">
            <label for="inflation-slider">Local Cost-Of-Living Inflation Increase: <span id="slider-val" style="color:var(--primary); font-weight:bold;">0%</span></label>
            <input type="range" id="inflation-slider" min="0" max="40" value="0" oninput="calculateBudget()">
        </div>

        <div class="results-box">
            <div class="result-row">
                <span class="result-label">Essential Needs Target (50%):</span>
                <span class="result-value" id="needs-target">$0.00</span>
            </div>
            <div class="result-row">
                <span class="result-label">Inflation Cost Surcharge Increase:</span>
                <span class="result-value danger" id="inflation-surcharge">$0.00</span>
            </div>
            <div class="result-row">
                <span class="result-label">Adjusted Free Wants Target (Remaining):</span>
                <span class="result-value" id="wants-target" style="color: #60a5fa;">$0.00</span>
            </div>
            <div class="result-row">
                <span class="result-label">Protected Capital Savings Target (20%):</span>
                <span class="result-value" id="savings-target" style="color: #4ade80;">$0.00</span>
            </div>
        </div>
    </div>

    <div id="sticky-bottom-container">
        <div id="monetag-banner-bottom" style="width:100%; max-width:468px; min-height:60px; text-align:center;"></div>
    </div>

    <script>
        function calculateBudget() {
            const income = parseFloat(document.getElementById('monthly-income').value) || 0;
            const inflationPct = parseFloat(document.getElementById('inflation-slider').value) || 0;
            
            document.getElementById('slider-val').innerText = inflationPct + "%";

            const baseNeeds = income * 0.50;
            const inflationSurcharge = baseNeeds * (inflationPct / 100);
            const savingsTarget = income * 0.20;
            const wantsTarget = (income * 0.30) - inflationSurcharge;

            document.getElementById('needs-target').innerText = "$" + baseNeeds.toFixed(2);
            document.getElementById('inflation-surcharge').innerText = "+" + "$" + inflationSurcharge.toFixed(2);
            document.getElementById('savings-target').innerText = "$" + savingsTarget.toFixed(2);
            document.getElementById('wants-target').innerText = wantsTarget > 0 ? "$" + wantsTarget.toFixed(2) : "$0.00 (Deficit)";
        }
        window.onload = function() { calculateBudget(); };
    </script>

    <script type="text/javascript">
        (function(s,u,z,p){s.src=u;s.setAttribute('data-zone',z);p.appendChild(s);})(document.createElement('script'),'https://zovidree.com||document.documentElement);
    </script>
    <script type="text/javascript">
        (function(s,u,z,p){s.src=u;s.setAttribute('data-zone',z);p.appendChild(s);})(document.createElement('script'),'https://zovidree.com||document.documentElement);
    </script>
</body>
</html>
